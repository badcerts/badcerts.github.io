   <g id="text_1">
    <text style="font-weight: 700; font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #163336" x="7" y="15.358281" transform="rotate(-0 7 15.358281)">F03  /  Two arguments with visible limits</text>
   </g>
   <g id="text_2">
    <text style="font-weight: 700; font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #163336" x="7" y="51.598437" transform="rotate(-0 7 51.598437)">R05  /  Negative byte audit</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #176da5" x="13" y="75.838594" transform="rotate(-0 13 75.838594)">DATA</text>
   </g>
   <g id="text_4">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #163336" transform="translate(13 89.838594)">17 files; scanned hidden,</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #163336" transform="translate(13 100.942414)">format and whitespace</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #163336" transform="translate(13 112.046234)">classes reported absent.</text>
   </g>
   <g id="text_5">
    <text style="font-weight: 700; font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #007c83" x="293" y="75.838594" transform="rotate(-0 293 75.838594)">BOUNDED CLAIM</text>
   </g>
   <g id="text_6">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #163336" transform="translate(293 89.838594)">Named unusual-byte features</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #163336" transform="translate(293 100.942414)">not observed in the</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #163336" transform="translate(293 112.046234)">checked copies.</text>
   </g>
   <g id="text_7">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #52666a" x="234" y="82.838594" transform="rotate(-0 234 82.838594)">supports</text>
   </g>
   <g id="text_8">
    <text style="font-weight: 700; font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #98611a" x="13" y="151.838594" transform="rotate(-0 13 151.838594)">QUALIFIER / CUSTODY</text>
   </g>
   <g id="text_9">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #163336" transform="translate(13 165.838594)">Audit output recovered;</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #163336" transform="translate(13 176.942414)">17 original inputs</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #163336" transform="translate(13 188.046234)">unavailable.</text>
   </g>
   <g id="text_10">
    <text style="font-weight: 700; font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #007c83" x="166" y="151.838594" transform="rotate(-0 166 151.838594)">WARRANT</text>
   </g>
   <g id="text_11">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #163336" transform="translate(166 165.838594)">A specified-feature check</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #163336" transform="translate(166 176.942414)">constrains that feature in</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #163336" transform="translate(166 188.046234)">the inspected copy.</text>
   </g>
   <g id="text_12">
    <text style="font-weight: 700; font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #98611a" x="324" y="151.838594" transform="rotate(-0 324 151.838594)">REBUTTAL / LIMIT</text>
   </g>
   <g id="text_13">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #163336" transform="translate(324 165.838594)">Ordinary separators / export</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #163336" transform="translate(324 176.942414)">may evade the checks;</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #163336" transform="translate(324 188.046234)">no universal sensitivity.</text>
   </g>
   <g id="text_14">
    <text style="font-weight: 700; font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #163336" x="7" y="233.598437" transform="rotate(-0 7 233.598437)">R18  /  Positive keyed excess</text>
   </g>
   <g id="text_15">
    <text style="font-weight: 700; font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #176da5" x="13" y="257.838594" transform="rotate(-0 13 257.838594)">DATA</text>
   </g>
   <g id="text_16">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #163336" transform="translate(13 271.838594)">Primary key: 168/252 raw;</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #163336" transform="translate(13 282.942414)">60/93 distinct-window hits.</text>
   </g>
   <g id="text_17">
    <text style="font-weight: 700; font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #007c83" x="293" y="257.838594" transform="rotate(-0 293 257.838594)">BOUNDED CLAIM</text>
   </g>
   <g id="text_18">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #163336" transform="translate(293 271.838594)">Keyed excess remains after</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #163336" transform="translate(293 282.942414)">exact-repeat removal;</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #163336" transform="translate(293 294.046234)">no authorship verdict.</text>
   </g>
   <g id="text_19">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #52666a" x="234" y="264.838594" transform="rotate(-0 234 264.838594)">supports</text>
   </g>
   <g id="text_20">
    <text style="font-weight: 700; font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #98611a" x="13" y="333.838594" transform="rotate(-0 13 333.838594)">QUALIFIER / CUSTODY</text>
   </g>
   <g id="text_21">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #163336" transform="translate(13 347.838594)">Original-key local rescore;</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #163336" transform="translate(13 358.942414)">one pair; public replay</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #163336" transform="translate(13 370.046234)">has no secret keys.</text>
   </g>
   <g id="text_22">
    <text style="font-weight: 700; font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #007c83" x="166" y="333.838594" transform="rotate(-0 166 333.838594)">WARRANT</text>
   </g>
   <g id="text_23">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #163336" transform="translate(166 347.838594)">Under retained construction,</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #163336" transform="translate(166 358.942414)">compare hits with registered</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #163336" transform="translate(166 370.046234)">gamma = 0.25.</text>
   </g>
   <g id="text_24">
    <text style="font-weight: 700; font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #98611a" x="324" y="333.838594" transform="rotate(-0 324 333.838594)">REBUTTAL / LIMIT</text>
   </g>
   <g id="text_25">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #163336" transform="translate(324 347.838594)">Repeat removal is not</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #163336" transform="translate(324 358.942414)">independence; nominal z is</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #163336" transform="translate(324 370.046234)">not a calibrated error rate.</text>
   </g>
   <g id="text_26">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #52666a" transform="translate(7 402.838594)">Solid arrows connect data, warrant and claim; dotted links constrain scope.</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #52666a" transform="translate(7 413.942414)">Geometry encodes reasoning roles, not evidence strength or authentication.</text>
   </g>
  </g>
